title: Pierre Bonami
description: >-
  Principal Developer at Gurobi Optimization. Researcher in Mixed-Integer
  Programming, MINLP, and cutting-plane theory. On leave from CNRS.
author: Pierre Bonami

# Update these for your deployment target:
# - User site (username.github.io):  leave baseurl empty and set url below
# - Project site (username.github.io/repo): set baseurl to "/repo-name"
url: "https://pobonomo.github.io"
baseurl: ""   # e.g. "/my-repo" for a project site

# Theme — supported natively by GitHub Pages
theme: minima

# Minima skin (optional: "dark" or leave blank for default light)
minima:
  skin: classic

# Social links shown in footer
author:
  name: Pierre Bonami
  email: ""           # add your email if desired
  github: pobonomo

# Navigation pages (order matters)
header_pages:
  - index.md

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/

# GitHub Pages safe plugins only
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
